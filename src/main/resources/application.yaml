spring:
  application:
    name: Kayak Planner

  datasource:
    url: jdbc:postgresql://localhost:5432/kayak_planner
    username: postgres
    password: postgres

  flyway:
    enabled: true

  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    org.springframework.boot.autoconfigure.flyway: DEBUG