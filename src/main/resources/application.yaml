spring:
  application:
    name: Kayak Planner

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kayak_planner}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  flyway:
    enabled: true

  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    org.springframework.boot.autoconfigure.flyway: DEBUG